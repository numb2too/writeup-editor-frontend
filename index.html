<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writeups JSON 編輯器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            padding: 20px;
        }

        .sidebar {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .sidebar h3 {
            margin-bottom: 15px;
            color: #667eea;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .detect-section {
            margin-bottom: 20px;
        }

        .detect-btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
            font-weight: 600;
        }

        .detect-btn:hover {
            background: #5568d3;
        }

        .detect-btn:disabled {
            background: #adb5bd;
            cursor: not-allowed;
        }

        .search-section {
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .all-tags {
            margin-top: 20px;
        }

        .tag-item {
            display: inline-block;
            background: #e7e9fc;
            color: #667eea;
            padding: 5px 10px;
            margin: 3px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
        }

        .tag-item:hover {
            background: #667eea;
            color: white;
        }

        .tag-item.active {
            background: #667eea;
            color: white;
        }

        .tag-count {
            background: rgba(255, 255, 255, 0.3);
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 10px;
            margin-left: 5px;
        }

        .stats {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        .stat-label {
            color: #666;
        }

        .stat-value {
            font-weight: 600;
            color: #667eea;
        }

        .articles-grid {
            display: grid;
            gap: 20px;
        }

        .article-card {
            background: white;
            border: 2px solid #e7e9fc;
            border-radius: 10px;
            padding: 20px;
            transition: 0.3s;
        }

        .article-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .article-card.editing {
            border-color: #51cf66;
            box-shadow: 0 5px 15px rgba(81, 207, 102, 0.3);
        }

        .article-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .article-title-display {
            font-size: 1.3em;
            color: #333;
            font-weight: 600;
        }

        .article-meta {
            text-align: right;
            font-size: 0.85em;
            color: #666;
        }

        .platform-badge {
            display: inline-block;
            background: #764ba2;
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75em;
            margin-bottom: 5px;
        }

        .edit-field {
            margin-bottom: 10px;
        }

        .edit-field label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 0.9em;
            font-weight: 600;
        }

        .edit-field input,
        .edit-field textarea {
            width: 100%;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 0.9em;
        }

        .edit-field textarea {
            resize: vertical;
            min-height: 60px;
        }

        .edit-field input:focus,
        .edit-field textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .article-tools {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .tool-tag {
            display: inline-block;
            background: #e7e9fc;
            color: #667eea;
            padding: 5px 10px;
            margin: 3px;
            border-radius: 15px;
            font-size: 0.85em;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
        }

        .tool-tag:hover {
            background: #ff6b6b;
            color: white;
        }

        .tool-tag:hover::after {
            content: '✕';
            position: absolute;
            right: 5px;
        }

        .add-tag-section {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        .add-tag-input {
            flex: 1;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 0.9em;
        }

        .add-tag-btn {
            padding: 8px 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .add-tag-btn:hover {
            background: #5568d3;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: 0.3s;
            font-weight: 600;
        }

        .btn-save {
            background: #51cf66;
            color: white;
            flex: 1;
        }

        .btn-save:hover {
            background: #40c057;
        }

        .btn-delete {
            background: #ff6b6b;
            color: white;
        }

        .btn-delete:hover {
            background: #ff5252;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            display: none;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .notification.show {
            display: block;
        }

        .notification.success {
            border-left: 4px solid #51cf66;
        }

        .notification.error {
            border-left: 4px solid #ff6b6b;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .clear-search {
            background: #adb5bd;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85em;
            width: 100%;
            margin-top: 5px;
        }

        .clear-search:hover {
            background: #868e96;
        }
    </style>
</head>

<body>
    <div class="notification" id="notification"></div>

    <div class="container">
        <div class="header">
            <h1>📝 Writeups JSON 編輯器</h1>
            <p>自動偵測新資料夾並即時儲存修改</p>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <h3>🔍 偵測新文章</h3>
                <div class="detect-section">
                    <button class="detect-btn" onclick="detectNewFolders()">🔎 偵測 /writeups 資料夾</button>
                </div>

                <h3>🔎 搜尋篩選</h3>
                <div class="search-section">
                    <input type="text" class="search-input" id="searchInput" placeholder="搜尋標題或標籤..."
                        onkeyup="filterArticles()">
                    <button class="clear-search" onclick="clearSearch()">清除搜尋</button>
                </div>

                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label">文章總數:</span>
                        <span class="stat-value" id="totalArticles">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">顯示文章:</span>
                        <span class="stat-value" id="filteredArticles">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">標籤總數:</span>
                        <span class="stat-value" id="totalTags">0</span>
                    </div>
                </div>

                <div class="all-tags">
                    <h3>🏷️ 所有標籤</h3>
                    <div id="allTagsList"></div>
                </div>
            </div>

            <div class="articles-grid" id="articlesGrid"></div>
        </div>
    </div>

    <script>
        // 後端 API 基礎路徑
        const API_BASE_URL = 'http://localhost:8080';

        let articles = [];
        let isLoading = true;
        let activeFilter = null;
        let editingStates = {};

        // 載入 JSON 資料
        async function loadJSON() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/writeup`);
                if (!response.ok) {
                    throw new Error('無法載入 writeup.json');
                }
                const result = await response.json();
                articles = result.data || [];
                // 按日期排序，新的在上面
                articles.sort((a, b) => new Date(b.date) - new Date(a.date));
                isLoading = false;
                renderArticles();
                renderAllTags();
                updateStats();
            } catch (error) {
                console.error('載入 JSON 失敗:', error);
                showNotification('無法載入資料: ' + error.message, 'error');
                articles = [];
                isLoading = false;
                renderArticles();
                renderAllTags();
                updateStats();
            }
        }

        function getCurrentDate() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        }

        // 偵測新資料夾
        async function detectNewFolders() {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '偵測中...';

            try {
                const response = await fetch(`${API_BASE_URL}/api/detectNewFolders`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error('API 請求失敗');
                }

                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.message || '偵測失敗');
                }

                const newFolders = result.newFolders;

                if (newFolders.length === 0) {
                    showNotification('沒有發現新資料夾', 'success');
                } else {
                    // 自動新增所有新資料夾
                    let addedCount = 0;
                    for (const folderName of newFolders) {
                        const newArticle = {
                            "title": folderName,
                            "description": folderName,
                            "tools": ["knowledge", folderName],
                            "date": getCurrentDate(),
                            "folder": folderName,
                            "platform": "knowledge"
                        };

                        articles.unshift(newArticle); // 新文章加在最上面
                        addedCount++;
                    }

                    await saveToJSON();
                    renderArticles();
                    renderAllTags();
                    updateStats();
                    showNotification(`成功新增 ${addedCount} 個新資料夾：${newFolders.join(', ')}`, 'success');
                }

            } catch (error) {
                console.error('偵測失敗:', error);
                showNotification('偵測失敗: ' + error.message, 'error');
            }

            btn.disabled = false;
            btn.textContent = '🔎 偵測 /writeups 資料夾';
        }

        // 儲存到 JSON
        async function saveToJSON() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/saveToJson`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(articles)
                });

                if (!response.ok) {
                    throw new Error('儲存失敗');
                }

                const result = await response.json();
                console.log('儲存成功:', result);
                return true;
            } catch (error) {
                console.error('儲存錯誤:', error);
                throw new Error('儲存失敗: ' + error.message);
            }
        }

        function getAllTags() {
            const tagsMap = {};
            articles.forEach(article => {
                article.tools.forEach(tool => {
                    tagsMap[tool] = (tagsMap[tool] || 0) + 1;
                });
            });
            return tagsMap;
        }

        function renderAllTags() {
            const tagsMap = getAllTags();
            const tagsList = document.getElementById('allTagsList');
            const sortedTags = Object.entries(tagsMap).sort((a, b) => b[1] - a[1]);

            tagsList.innerHTML = sortedTags.map(([tag, count]) =>
                `<span class="tag-item ${activeFilter === tag ? 'active' : ''}" onclick="filterByTag('${tag.replace(/'/g, "\\'")}')">
                    ${tag}<span class="tag-count">${count}</span>
                </span>`
            ).join('');
        }

        function filterByTag(tag) {
            if (activeFilter === tag) {
                activeFilter = null;
                document.getElementById('searchInput').value = '';
            } else {
                activeFilter = tag;
                document.getElementById('searchInput').value = tag;
            }
            filterArticles();
            renderAllTags();
        }

        function filterArticles() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            activeFilter = searchText || null;
            renderArticles();
            renderAllTags();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            activeFilter = null;
            filterArticles();
        }

        function renderArticles() {
            const grid = document.getElementById('articlesGrid');

            if (isLoading) {
                grid.innerHTML = '<div style="text-align: center; padding: 50px; color: #667eea;">載入中...</div>';
                return;
            }

            let filteredArticles = articles;
            if (activeFilter) {
                const search = activeFilter.toLowerCase();
                filteredArticles = articles.filter(article =>
                    article.title.toLowerCase().includes(search) ||
                    article.folder.toLowerCase().includes(search) ||
                    article.tools.some(tool => tool.toLowerCase().includes(search))
                );
            }

            // 只顯示最新的 6 筆
            const displayArticles = filteredArticles.slice(0, 6);

            document.getElementById('filteredArticles').textContent = displayArticles.length;

            if (displayArticles.length === 0) {
                grid.innerHTML = '<div style="text-align: center; padding: 50px; color: #999;">找不到符合的文章</div>';
                return;
            }

            grid.innerHTML = displayArticles.map((article, index) => {
                const originalIndex = articles.indexOf(article);
                const isEditing = editingStates[originalIndex];

                return `
                <div class="article-card ${isEditing ? 'editing' : ''}">
                    <div class="article-header">
                        <div>
                            <div class="article-title-display">${article.title}</div>
                            ${article.platform ? `<span class="platform-badge">${article.platform}</span>` : ''}
                        </div>
                        <div class="article-meta">
                            <div>📅 ${article.date}</div>
                            <div>📁 ${article.folder}</div>
                        </div>
                    </div>
                    
                    <div class="edit-field">
                        <label>標題:</label>
                        <input type="text" id="title-${originalIndex}" value="${article.title}">
                    </div>
                    
                    <div class="edit-field">
                        <label>資料夾名稱:</label>
                        <input type="text" id="folder-${originalIndex}" value="${article.folder}">
                    </div>
                    
                    <div class="edit-field">
                        <label>描述:</label>
                        <textarea id="desc-${originalIndex}">${article.description}</textarea>
                    </div>
                    
                    <div class="edit-field">
                        <label>平台:</label>
                        <input type="text" id="platform-${originalIndex}" value="${article.platform || ''}">
                    </div>
                    
                    <div class="edit-field">
                        <label>日期時間:</label>
                        <input type="datetime-local" id="date-${originalIndex}" value="${article.date.replace(' ', 'T')}">
                    </div>
                    
                    <div class="article-tools">
                        <label style="margin-bottom: 10px; display: block; color: #666; font-weight: 600;">🏷️ 標籤 (點擊刪除):</label>
                        ${article.tools.map(tool =>
                    `<span class="tool-tag" onclick="removeTag(${originalIndex}, '${tool.replace(/'/g, "\\'")}')">${tool}</span>`
                ).join('')}
                        
                        <div class="add-tag-section">
                            <input type="text" class="add-tag-input" id="newTag-${originalIndex}" placeholder="新增標籤...">
                            <button class="add-tag-btn" onclick="addTag(${originalIndex})">+ 新增</button>
                        </div>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="btn btn-save" onclick="saveArticle(${originalIndex})">💾 儲存修改</button>
                        <button class="btn btn-delete" onclick="deleteArticle(${originalIndex})">🗑️ 刪除</button>
                    </div>
                </div>
            `}).join('');
        }

        async function saveArticle(index) {
            try {
                editingStates[index] = true;
                renderArticles();

                const title = document.getElementById(`title-${index}`).value.trim();
                const folder = document.getElementById(`folder-${index}`).value.trim();
                const description = document.getElementById(`desc-${index}`).value.trim();
                const platform = document.getElementById(`platform-${index}`).value.trim();
                const dateTimeValue = document.getElementById(`date-${index}`).value;
                const date = dateTimeValue.replace('T', ' '); // 轉換回 YYYY-MM-DD HH:MM:SS 格式

                if (!title || !folder) {
                    showNotification('標題和資料夾名稱不能為空', 'error');
                    delete editingStates[index];
                    renderArticles();
                    return;
                }

                articles[index].title = title;
                articles[index].folder = folder;
                articles[index].description = description;
                articles[index].platform = platform;
                articles[index].date = date;

                // 重新排序
                articles.sort((a, b) => new Date(b.date) - new Date(a.date));

                await saveToJSON();

                delete editingStates[index];
                renderArticles();
                renderAllTags();
                updateStats();
                showNotification('✅ 儲存成功！', 'success');
            } catch (error) {
                delete editingStates[index];
                renderArticles();
                showNotification('儲存失敗: ' + error.message, 'error');
            }
        }

        async function addTag(index) {
            const input = document.getElementById(`newTag-${index}`);
            const newTag = input.value.trim();

            if (!newTag) return;

            if (articles[index].tools.includes(newTag)) {
                showNotification('此標籤已存在！', 'error');
                return;
            }

            articles[index].tools.push(newTag);
            input.value = '';

            await saveToJSON();
            renderArticles();
            renderAllTags();
            updateStats();
            showNotification('標籤已新增', 'success');
        }

        async function removeTag(index, tag) {
            if (confirm(`確定要刪除標籤「${tag}」嗎？`)) {
                articles[index].tools = articles[index].tools.filter(t => t !== tag);
                await saveToJSON();
                renderArticles();
                renderAllTags();
                updateStats();
                showNotification('標籤已刪除', 'success');
            }
        }

        async function deleteArticle(index) {
            if (confirm(`確定要刪除文章「${articles[index].title}」嗎？`)) {
                articles.splice(index, 1);
                await saveToJSON();
                renderArticles();
                renderAllTags();
                updateStats();
                showNotification('文章已刪除', 'success');
            }
        }

        function updateStats() {
            document.getElementById('totalArticles').textContent = articles.length;
            document.getElementById('totalTags').textContent = Object.keys(getAllTags()).length;
        }

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type} show`;

            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // 初始化
        loadJSON();
    </script>
</body>

</html>
